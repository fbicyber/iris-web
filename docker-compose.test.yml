services:
  testrabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: iriswebapp_rabbitmq_test
    networks:
      - iris_backend_test

  # ephemeral object storage for tests
  testfs:
    image: rustfs/rustfs:latest
    container_name: iriswebapp_fs_test
    ports:
      - "127.0.0.1:9009:9000"
      - "127.0.0.1:9010:9001"
    hostname: testfs
    networks:
      - iris_backend_test
    environment:
      - RUSTFS_SECRET_KEY
      - RUSTFS_ACCESS_KEY

  # ephemeral database for tests
  testdb:
    container_name: iriswebapp_db_test
    build:
      context: docker/db
    image: iriswebapp_db:v2.4.20
    env_file:
      - .env.test
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_ADMIN_USER=raptor
      - POSTGRES_ADMIN_PASSWORD=admin
      - POSTGRES_DB=iris_db
    ports:
      - "127.0.0.1:5433:5433"
    command: ["postgres", "-p", "5433"]
    networks:
      - iris_backend_test

  testapp:
    container_name: iriswebapp_app_test
    build:
      context: .
      dockerfile: docker/webAppTest/Dockerfile
    image: iriswebapp_app_test:v2.4.20
    volumes:
      - ./certificates/rootCA/irisRootCACert.pem:/etc/irisRootCACert.pem:ro
      - ./certificates/:/home/iris/certificates/:ro
      - ./certificates/ldap/:/iriswebapp/certificates/ldap/:ro
      - ./iris-downloads:/home/iris/downloads
      - ./user_templates:/home/iris/user_templates
      - ./server_data:/home/iris/server_data
      - ./source/app/:/iriswebapp/app/
      - ./source/coverage:/iriswebapp/coverage
    depends_on:
      - "testrabbitmq"
      - "testdb"
      - "testfs"
    env_file:
      - .env.test
    networks:
      - iris_backend_test
      - iris_frontend_test


networks:
  iris_backend_test:
    name: iris_backend_test
  iris_frontend_test:
    name: iris_frontend_test
